# Continuous integration: lint, typecheck, test and build on every PR / push.
# Fast checks run in parallel; the package build gates on them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A second push to the same branch cancels the in-flight run instead of
# queueing behind it. Never cancel on main - those runs are the release record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Not `bun run lint` - that script is `oxlint --fix`, which mutates.
      - name: Lint (oxlint)
        run: bunx oxlint

      - name: Check formatting (oxfmt)
        if: "!cancelled()"
        run: bunx oxfmt --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc)
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    # Don't bother packaging if the cheap checks already failed.
    needs: [lint, typecheck, test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun build.ts` not `bun run build` - the latter re-runs tsc, which
      # the typecheck job already did.
      - name: Build
        run: bun build.ts

      # Catches an empty or over-broad tarball before it reaches npm.
      - name: Verify package contents
        run: npm pack --dry-run
